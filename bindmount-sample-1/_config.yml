name: Semgrep

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: [self-hosted, aks-selfhosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional – replicate ADO secure cert handling
      # Store full PEM as GitHub Secret: NFCU_FULL_CHAIN_SEMGREP_PEM
      - name: Configure TLS trust (internal CA bundle)
        if: ${{ secrets.NFCU_FULL_CHAIN_SEMGREP_PEM != '' }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/nfcu_full_chain_semgrep.pem"
          echo "${{ secrets.NFCU_FULL_CHAIN_SEMGREP_PEM }}" > "$CERT_PATH"
          chmod 600 "$CERT_PATH"

          echo "SEM_SSL_CERT_FILE=$CERT_PATH" >> $GITHUB_ENV
          echo "SEM_REQUESTS_CA_BUNDLE=$CERT_PATH" >> $GITHUB_ENV
          echo "SSL_CERT_FILE=$CERT_PATH" >> $GITHUB_ENV
          echo "REQUESTS_CA_BUNDLE=$CERT_PATH" >> $GITHUB_ENV

      # Login to internal Artifactory
      - name: Docker login (Artifactory)
        shell: bash
        run: |
          echo "${{ secrets.ARTIFACTORY_TOKEN }}" | docker login prod.artifactory.nfcu.net \
            -u "${{ secrets.ARTIFACTORY_USER }}" --password-stdin

      # Pull internal Semgrep image
      - name: Pull Semgrep image
        shell: bash
        run: |
          docker pull prod.artifactory.nfcu.net/docker/semgrep/semgrep:latest

      # Run Semgrep CI
      - name: Run Semgrep
        shell: bash
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e SEMGREP_APP_TOKEN="${SEMGREP_APP_TOKEN}" \
            -e SEM_SSL_CERT_FILE="${SEM_SSL_CERT_FILE:-}" \
            -e SEM_REQUESTS_CA_BUNDLE="${SEM_REQUESTS_CA_BUNDLE:-}" \
            -e SSL_CERT_FILE="${SSL_CERT_FILE:-}" \
            -e REQUESTS_CA_BUNDLE="${REQUESTS_CA_BUNDLE:-}" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            prod.artifactory.nfcu.net/docker/semgrep/semgrep:latest \
            semgrep ci