<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFCU Artifactory – Third-Party Dependency Lifecycle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #080C12; font-family: 'IBM Plex Sans', sans-serif; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0D1520; }
::-webkit-scrollbar-thumb { background: #1E3A5A; border-radius: 3px; }
.step-card { transition: all 0.2s ease; cursor: pointer; }
.step-card:hover { transform: translateY(-2px); }
.tab-btn { transition: all 0.2s ease; cursor: pointer; border: none; font-family: 'IBM Plex Mono', monospace; }
.tab-btn:hover { opacity: 0.85; }
.gap-card { transition: transform 0.2s ease; }
.gap-card:hover { transform: translateX(4px); }
@keyframes slideIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
.animate-in { animation: slideIn 0.25s ease forwards; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const steps = [
  { id:1, icon:"📋", title:"Request & Approval", status:"controlled",
    details:["Application teams request via ServiceNow catalog intake workflow","Approval from application team manager","Security approval may be requested case-by-case","Unauthorized/personal artifacts are NOT allowed"],
    control:"Approval gate enforced before any artifact enters the environment" },
  { id:2, icon:"🌐", title:"Source of Dependencies", status:"controlled",
    details:["Predefined trusted remote repositories","Open-source ecosystems (Maven, NPM, PyPI, etc.)","Vendor-provided artifacts via configured upstream or manual upload","All proxied into Artifactory via remote repositories"],
    control:"Sources restricted to approved trusted repositories only" },
  { id:3, icon:"🔍", title:"Pre-Entry Vetting (Curation)", status:"partial",
    details:["JFrog Curation evaluates before entering NFCU environment","Uses metadata + external intelligence (not NFCU-controlled)","Blocks artifacts based on configured security policies","Known vulnerable artifacts may be blocked before entry"],
    control:"Curation logic is externally managed — not directly controlled by NFCU" },
  { id:4, icon:"🔄", title:"Ingestion via DMZ → Internal", status:"controlled",
    details:["Dependencies staged externally in DMZ first","Promoted into internal Artifactory repositories","Creates a logical trust boundary","DMZ separation enforces external/internal split"],
    control:"Trust boundary separates external sources from internal repositories" },
  { id:5, icon:"🛡️", title:"Security Scanning (JFrog Xray)", status:"partial",
    details:["Scans using NVD + VulnDB vulnerability databases","Scanning at ingestion AND continuously over time","Only CRITICAL (CVSS-based) vulnerabilities are blocked","High/Medium severity vulnerabilities are NOT enforced"],
    control:"⚠️ Enforcement gap: High/Medium vulns pass through unchecked" },
  { id:6, icon:"📦", title:"Artifact Availability to Developers", status:"gap",
    details:["Approved artifacts via local/virtual repositories","Served via internal Artifactory endpoints","GAP: Some teams bypass Artifactory entirely","Direct internet pulls are not controlled or monitored"],
    control:"⚠️ Not all teams route through Artifactory — enforcement is incomplete" },
  { id:7, icon:"⚡", title:"Post-Ingestion Risk Handling", status:"gap",
    details:["Xray detection → auto-block (policy-dependent)","No Xray detection → manual intervention required","Already-downloaded artifacts may linger via caching","Caching is a residual risk after blocking is applied"],
    control:"⚠️ Cached artifacts remain accessible even after a block is applied" },
  { id:8, icon:"🚨", title:"Incident Response / Blocking", status:"partial",
    details:["Add to exclusion list, block access, remove visibility","Triggers: SIR/CSOC, Artifactory team, external findings","Blocking and communication are largely manual","No automated notification workflow exists"],
    control:"⚠️ IR is manual — automation needed for blocking and notifications" },
  { id:9, icon:"📄", title:"SBOM Handling", status:"gap",
    details:["❌ No native SBOM for third-party deps in JFrog","✅ SBOMs for internal apps via Black Duck pipelines","✅ Stored in Artifactory for supported pipelines","GAP: No SBOM at third-party ingestion level"],
    control:"⚠️ Supply chain bill of materials is incomplete for third-party deps" },
  { id:10, icon:"✍️", title:"Signature & License Validation", status:"gap",
    details:["Capability exists: signature validation + license checks","❗ Currently NOT enforced for blocking","Reason: Prior enforcement caused usability issues","License violations and signature failures pass through"],
    control:"⚠️ Enforcement disabled — license and integrity risks not validated" },
];

const gaps = [
  { id:1, icon:"🔓", title:"Enforcement Gap",          desc:"Some teams bypass Artifactory entirely via direct internet access. No controls, scanning, or curation is applied to those dependency pulls." },
  { id:2, icon:"⚠️", title:"Weak Policy Enforcement",  desc:"Only Critical vulnerabilities are blocked. High/Medium vulns, license violations, and signature failures all pass through without enforcement." },
  { id:3, icon:"🔧", title:"Manual IR Processes",       desc:"Incident response blocking and communication to affected teams is largely manual with no automated workflow." },
  { id:4, icon:"👁️", title:"No Enterprise Visibility",  desc:"No mapping from artifact → application. No complete inventory or coverage metrics exist across the enterprise." },
  { id:5, icon:"📋", title:"SBOM Gaps",                 desc:"No SBOMs generated for third-party artifacts at the ingestion level — a significant gap for compliance and incident response." },
];

const matrix = [
  { label:"Critical Vulnerability Blocking",      status:"✅  Enforced",      c:"#2A9D5C", bg:"#0D2F1A", b:"#1E6B3A" },
  { label:"High / Medium Vulnerability Blocking", status:"❌  Not Enforced",   c:"#E05C5C", bg:"#2B0A0A", b:"#7A1E1E" },
  { label:"License Violation Blocking",           status:"❌  Not Enforced",   c:"#E05C5C", bg:"#2B0A0A", b:"#7A1E1E" },
  { label:"Signature Validation Blocking",        status:"❌  Not Enforced",   c:"#E05C5C", bg:"#2B0A0A", b:"#7A1E1E" },
  { label:"SBOM at Third-Party Ingestion",        status:"❌  No Coverage",    c:"#E05C5C", bg:"#2B0A0A", b:"#7A1E1E" },
  { label:"Artifactory Routing (All Teams)",      status:"⚠️  Partial",        c:"#F5A623", bg:"#2B1E00", b:"#7A5200" },
  { label:"Automated IR & Blocking",              status:"⚠️  Partial",        c:"#F5A623", bg:"#2B1E00", b:"#7A5200" },
  { label:"Enterprise Artifact Visibility",       status:"❌  No Coverage",    c:"#E05C5C", bg:"#2B0A0A", b:"#7A1E1E" },
];

const sc = {
  controlled:{ bg:"#0D2F1A", border:"#1E6B3A", badge:"#2A9D5C", label:"Controlled" },
  partial:   { bg:"#2B1E00", border:"#7A5200", badge:"#F5A623", label:"Partial" },
  gap:       { bg:"#2B0A0A", border:"#7A1E1E", badge:"#E05C5C", label:"Gap" },
};

function App() {
  const [active, setActive] = useState(null);
  const [view, setView]     = useState("diagram");

  return (
    <div style={{fontFamily:"'IBM Plex Mono',monospace",background:"#080C12",minHeight:"100vh",color:"#8AAAC0"}}>

      {/* ── HEADER ── */}
      <div style={{background:"linear-gradient(135deg,#0D1A2E,#0A2040)",borderBottom:"1px solid #1A3A60",padding:"28px 32px 20px"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontSize:10,letterSpacing:3,color:"#4A9EFF",marginBottom:6}}>SUPPLY CHAIN SECURITY // CURRENT STATE</div>
            <h1 style={{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:"clamp(16px,2.5vw,24px)",fontWeight:700,color:"#E8F4FF",margin:0}}>
              NFCU Artifactory — Third-Party Dependency Lifecycle
            </h1>
            <div style={{marginTop:8,display:"flex",gap:16,flexWrap:"wrap"}}>
              {[["#2A9D5C","Controlled"],["#F5A623","Partial Coverage"],["#E05C5C","Gap / Risk"]].map(([c,l]) => (
                <span key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"#8AAAC0"}}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:c,display:"inline-block"}}/>
                  {l}
                </span>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {["diagram","gaps","summary"].map(v => (
              <button key={v} className="tab-btn" onClick={() => { setView(v); setActive(null); }} style={{
                padding:"8px 16px",borderRadius:6,fontSize:11,letterSpacing:1,textTransform:"uppercase",
                background:view===v?"#1A3D6B":"transparent",
                color:view===v?"#4A9EFF":"#5A7A9A",
                border:`1px solid ${view===v?"#2A5DA0":"#1A3A60"}`,
              }}>{v}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{padding:"24px 32px",maxWidth:1200,margin:"0 auto"}}>

        {/* ── DIAGRAM ── */}
        {view==="diagram" && (
          <div className="animate-in" style={{display:"grid",gridTemplateColumns:active?"1fr 340px":"1fr",gap:20}}>
            <div>
              <div style={{fontSize:11,color:"#4A7A9A",letterSpacing:2,marginBottom:16}}>END-TO-END LIFECYCLE FLOW — click any step to expand</div>
              <div style={{display:"flex",flexDirection:"column"}}>
                {steps.map((step,idx) => {
                  const s = sc[step.status];
                  const on = active?.id===step.id;
                  return (
                    <div key={step.id}>
                      <div className="step-card" onClick={() => setActive(on?null:step)} style={{
                        background:on?s.bg:"#0D1520",border:`1px solid ${on?s.border:"#1A2E44"}`,
                        borderLeft:`3px solid ${s.badge}`,borderRadius:8,padding:"12px 16px",
                        display:"flex",alignItems:"center",gap:12,
                      }}>
                        <div style={{width:28,height:28,borderRadius:6,background:"#0A1828",border:`1px solid ${s.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>
                          {step.icon}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span style={{fontSize:10,color:"#3A6A8A"}}>{String(step.id).padStart(2,"0")}</span>
                            <span style={{fontSize:13,fontWeight:600,color:on?"#E8F4FF":"#A0BDD4",fontFamily:"'IBM Plex Sans',sans-serif"}}>{step.title}</span>
                            <span style={{marginLeft:"auto",fontSize:9,letterSpacing:1,padding:"2px 7px",borderRadius:3,background:s.bg,border:`1px solid ${s.border}`,color:s.badge,flexShrink:0}}>
                              {s.label.toUpperCase()}
                            </span>
                          </div>
                          {!on && <div style={{fontSize:11,color:"#4A6A80",marginTop:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{step.details[0]}</div>}
                        </div>
                      </div>
                      {idx<steps.length-1 && <div style={{color:"#1E4A7A",fontSize:18,textAlign:"center",margin:"2px 0"}}>↓</div>}
                    </div>
                  );
                })}
              </div>
            </div>

            {active && (
              <div className="animate-in" style={{background:"#0D1520",border:`1px solid ${sc[active.status].border}`,borderRadius:10,padding:20,alignSelf:"start",position:"sticky",top:20}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
                  <span style={{fontSize:22}}>{active.icon}</span>
                  <div>
                    <div style={{fontSize:9,color:"#4A7A9A",letterSpacing:2}}>STEP {String(active.id).padStart(2,"0")}</div>
                    <div style={{fontSize:14,fontWeight:700,color:"#E8F4FF",fontFamily:"'IBM Plex Sans',sans-serif"}}>{active.title}</div>
                  </div>
                  <button onClick={() => setActive(null)} style={{marginLeft:"auto",background:"none",border:"none",color:"#4A6A80",cursor:"pointer",fontSize:20,lineHeight:1}}>×</button>
                </div>
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:9,color:"#4A9EFF",letterSpacing:2,marginBottom:8}}>DETAILS</div>
                  {active.details.map((d,i) => (
                    <div key={i} style={{fontSize:11,color:"#8AAAC0",marginBottom:6,paddingLeft:10,borderLeft:"2px solid #1A3A5A",lineHeight:1.5}}>{d}</div>
                  ))}
                </div>
                <div style={{background:sc[active.status].bg,border:`1px solid ${sc[active.status].border}`,borderRadius:6,padding:"10px 12px"}}>
                  <div style={{fontSize:9,color:sc[active.status].badge,letterSpacing:2,marginBottom:4}}>KEY CONTROL / NOTE</div>
                  <div style={{fontSize:11,color:"#C0D4E8",lineHeight:1.5}}>{active.control}</div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── GAPS ── */}
        {view==="gaps" && (
          <div className="animate-in">
            <div style={{fontSize:11,color:"#E05C5C",letterSpacing:2,marginBottom:20}}>⚠ KEY GAPS & RISKS — LEADERSHIP CRITICAL POINTS</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14,marginBottom:28}}>
              {gaps.map(g => (
                <div key={g.id} className="gap-card" style={{background:"#0D1520",border:"1px solid #3A1A1A",borderLeft:"3px solid #E05C5C",borderRadius:8,padding:"16px 18px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                    <span style={{fontSize:18}}>{g.icon}</span>
                    <span style={{fontSize:13,fontWeight:700,color:"#E8C0C0",fontFamily:"'IBM Plex Sans',sans-serif"}}>{g.id}. {g.title}</span>
                  </div>
                  <p style={{fontSize:12,color:"#8A7070",margin:0,lineHeight:1.6}}>{g.desc}</p>
                </div>
              ))}
            </div>

            <div style={{fontSize:11,color:"#4A9EFF",letterSpacing:2,marginBottom:14}}>ENFORCEMENT COVERAGE MATRIX</div>
            <div style={{background:"#0D1520",border:"1px solid #1A2E44",borderRadius:8,overflow:"hidden"}}>
              <div style={{background:"#132848",padding:"9px 16px",display:"grid",gridTemplateColumns:"1fr 200px"}}>
                <span style={{fontSize:11,fontWeight:700,color:"#4A9EFF"}}>Control Area</span>
                <span style={{fontSize:11,fontWeight:700,color:"#4A9EFF"}}>Current Status</span>
              </div>
              {matrix.map((row,i) => (
                <div key={i} style={{padding:"9px 16px",display:"grid",gridTemplateColumns:"1fr 200px",alignItems:"center",background:i%2===0?"#0D1520":"#080C12",borderTop:"1px solid #0F1E2E"}}>
                  <span style={{fontSize:12,color:"#CADCFC"}}>{row.label}</span>
                  <span style={{fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:4,background:row.bg,border:`1px solid ${row.b}`,color:row.c,textAlign:"center"}}>{row.status}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── SUMMARY ── */}
        {view==="summary" && (
          <div className="animate-in">
            <div style={{fontSize:11,color:"#4A9EFF",letterSpacing:2,marginBottom:20}}>LEADERSHIP SUMMARY — THREE CONTROL LAYERS</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16,marginBottom:28}}>
              {[
                { num:"01", title:"Pre-Ingestion Control", sub:"CURATION LAYER", c:"#4A9EFF", bg:"#0D1A2E", border:"#1A3A6A",
                  pts:["ServiceNow request + manager approval","JFrog Curation vets before entry","Trusted/preconfigured repos only"],
                  status:"PARTIAL" },
                { num:"02", title:"Security Scanning", sub:"JFROG XRAY", c:"#F5A623", bg:"#1E1400", border:"#5A3A00",
                  pts:["Scans at ingestion + continuously","NVD + VulnDB sources","Only Critical CVEs enforced"],
                  status:"PARTIAL — CRITICAL ONLY" },
                { num:"03", title:"Operational Controls", sub:"INCIDENT RESPONSE", c:"#E05C5C", bg:"#1E0A0A", border:"#5A1A1A",
                  pts:["Manual blocking via exclusion lists","Triggered by SIR/CSOC or Artifactory team","Cached artifacts remain a risk post-block"],
                  status:"MANUAL / GAPS EXIST" },
              ].map(layer => (
                <div key={layer.num} style={{background:layer.bg,border:`1px solid ${layer.border}`,borderTop:`3px solid ${layer.c}`,borderRadius:8,padding:18}}>
                  <div style={{fontSize:28,fontWeight:700,color:layer.c,opacity:0.3,fontFamily:"'IBM Plex Mono'",lineHeight:1}}>{layer.num}</div>
                  <div style={{fontSize:14,fontWeight:700,color:"#E8F4FF",fontFamily:"'IBM Plex Sans',sans-serif",marginTop:4}}>{layer.title}</div>
                  <div style={{fontSize:9,color:layer.c,letterSpacing:1.5,marginBottom:12}}>{layer.sub}</div>
                  {layer.pts.map((p,i) => (
                    <div key={i} style={{fontSize:11,color:"#8AAAC0",marginBottom:5,display:"flex",gap:6}}>
                      <span style={{color:layer.c,flexShrink:0}}>—</span>{p}
                    </div>
                  ))}
                  <div style={{marginTop:12,padding:"5px 10px",borderRadius:4,background:"#080C12",fontSize:9,color:layer.c,letterSpacing:1}}>
                    STATUS: {layer.status}
                  </div>
                </div>
              ))}
            </div>

            <div style={{background:"#0D1A2E",border:"1px solid #1A3A6A",borderRadius:8,padding:20}}>
              <div style={{fontSize:11,color:"#4A9EFF",letterSpacing:2,marginBottom:14}}>KEY CHARACTERISTICS</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
                {[
                  {icon:"✅",text:"Controlled intake via ServiceNow + manager approval",good:true},
                  {icon:"✅",text:"Use of trusted/preconfigured repository sources",good:true},
                  {icon:"✅",text:"Critical vulnerability enforcement via Xray",good:true},
                  {icon:"⚠️",text:"Some teams bypass Artifactory (direct internet pulls)",good:false},
                  {icon:"⚠️",text:"Limited automation in incident response processes",good:false},
                  {icon:"⚠️",text:"SBOM gaps for third-party dependencies at ingestion",good:false},
                ].map((item,i) => (
                  <div key={i} style={{
                    padding:"10px 12px",borderRadius:6,
                    background:item.good?"#0D2F1A":"#2B0A0A",
                    border:`1px solid ${item.good?"#1E6B3A":"#5A1A1A"}`,
                    fontSize:11,color:"#A0BDD4",display:"flex",gap:8,alignItems:"flex-start",
                  }}>
                    <span style={{flexShrink:0}}>{item.icon}</span>
                    <span style={{lineHeight:1.5}}>{item.text}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </div>
      <div style={{textAlign:"center",padding:20,fontSize:10,color:"#2A4A6A",letterSpacing:1}}>
        NFCU // CICD Tools Team — JFrog Artifactory Lifecycle KT // Supply Chain Hardening
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
