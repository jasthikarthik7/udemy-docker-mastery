function StepPill({ id }) {
  const step = steps.find(s => s.id === id);
  if (!step) return null;
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"1px 7px",borderRadius:3,background:"#0D1520",border:"1px solid #1A3A5A",fontSize:9,color:"#6A9ABF",fontFamily:"'IBM Plex Mono'",margin:"1px 2px",whiteSpace:"nowrap"}}>
      {step.icon} {String(id).padStart(2,"0")} · {step.title}
    </span>
  );
}

                  {sc[active.status].label.toUpperCase()}
                </div>
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:9,color:"#4A9EFF",letterSpacing:2,marginBottom:8}}>DETAILS</div>
                  {active.details.map((d,i) => (
                    <div key={i} style={{fontSize:11,color:"#8AAAC0",marginBottom:6,paddingLeft:10,borderLeft:"2px solid #1A3A5A",lineHeight:1.5}}>{d}</div>
                  ))}
                </div>
                <div style={{background:sc[active.status].bg,border:`1px solid ${sc[active.status].border}`,borderRadius:6,padding:"10px 12px"}}>
                  <div style={{fontSize:9,color:sc[active.status].badge,letterSpacing:2,marginBottom:4}}>KEY CONTROL / NOTE</div>
                  <div style={{fontSize:11,color:"#C0D4E8",lineHeight:1.5}}>{active.control}</div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── GAPS ── */}
        {view==="gaps" && (
          <div className="animate-in">
            <div style={{fontSize:11,color:"#E05C5C",letterSpacing:2,marginBottom:20}}>⚠ KEY GAPS & RISKS — CURRENT STATE vs TARGET</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12,marginBottom:28}}>
              {gaps.map(g => (
                <div key={g.id} className="gap-card" style={{background:"#0D1520",border:"1px solid #3A1A1A",borderLeft:"3px solid #E05C5C",borderRadius:8,padding:"14px 16px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
                    <span style={{fontSize:17}}>{g.icon}</span>
                    <span style={{fontSize:12,fontWeight:700,color:"#E8C0C0",fontFamily:"'IBM Plex Sans',sans-serif"}}>{g.id}. {g.title}</span>
                  </div>
                  <p style={{fontSize:11,color:"#8A7070",margin:0,lineHeight:1.6}}>{g.desc}</p>
                </div>
              ))}
            </div>
            <div style={{fontSize:11,color:"#4A9EFF",letterSpacing:2,marginBottom:14}}>ENFORCEMENT COVERAGE MATRIX</div>
            <div style={{background:"#0D1520",border:"1px solid #1A2E44",borderRadius:8,overflow:"hidden"}}>
              <div style={{background:"#132848",padding:"9px 16px",display:"grid",gridTemplateColumns:"1fr 200px"}}>
                <span style={{fontSize:11,fontWeight:700,color:"#4A9EFF"}}>Control Area</span>
                <span style={{fontSize:11,fontWeight:700,color:"#4A9EFF"}}>Status</span>
              </div>
              {matrix.map((row,i) => (
                <div key={i} style={{padding:"8px 16px",display:"grid",gridTemplateColumns:"1fr 200px",alignItems:"center",background:i%2===0?"#0D1520":"#080C12",borderTop:"1px solid #0F1E2E"}}>
                  <span style={{fontSize:11,color:"#CADCFC"}}>{row.label}</span>
                  <span style={{fontSize:9,fontWeight:700,padding:"3px 8px",borderRadius:4,background:row.bg,border:`1px solid ${row.b}`,color:row.c,textAlign:"center",fontFamily:"'IBM Plex Mono'"}}>{row.status}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── SUMMARY ── */}
        {view==="summary" && (
          <div className="animate-in">
            <div style={{fontSize:11,color:"#4A9EFF",letterSpacing:2,marginBottom:20}}>STEP COUNT BY STATUS</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10,marginBottom:28}}>
              {[
                { label:"Controlled",       count:steps.filter(s=>s.status==="controlled").length,   c:"#2A9D5C", bg:"#0D2F1A", b:"#1E6B3A" },
                { label:"Partial",          count:steps.filter(s=>s.status==="partial").length,      c:"#F5A623", bg:"#2B1E00", b:"#7A5200" },
                { label:"Gap → Enforce",    count:steps.filter(s=>s.status==="gap_enforce").length,  c:"#FF8C42", bg:"#2B1500", b:"#7A4000" },
                { label:"Gap → Controlled", count:steps.filter(s=>s.status==="gap_control").length,  c:"#A0C040", bg:"#1A2000", b:"#4A6000" },
                { label:"Gap (Not Implemented)", count:steps.filter(s=>s.status==="gap").length,           c:"#E05C5C", bg:"#2B0A0A", b:"#7A1E1E" },
              ].map(item => (
                <div key={item.label} style={{padding:"14px",borderRadius:6,background:item.bg,border:`1px solid ${item.b}`,textAlign:"center"}}>
                  <div style={{fontSize:32,fontWeight:700,color:item.c,fontFamily:"'IBM Plex Mono'"}}>{item.count}</div>
                  <div style={{fontSize:10,color:item.c,marginTop:4,letterSpacing:0.5}}>{item.label}</div>
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14}}>
              {["controlled","partial","gap_enforce","gap_control","gap"].map(statusKey => (
                <div key={statusKey} style={{background:"#0D1520",border:`1px solid ${sc[statusKey].border}`,borderTop:`2px solid ${sc[statusKey].badge}`,borderRadius:8,padding:16}}>
                  <div style={{fontSize:9,color:sc[statusKey].badge,letterSpacing:2,marginBottom:10,fontFamily:"'IBM Plex Mono'"}}>{sc[statusKey].label.toUpperCase()}</div>
                  {steps.filter(s=>s.status===statusKey).map(s => (
                    <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,fontSize:11,color:"#8AAAC0"}}>
                      <span>{s.icon}</span>
                      <span style={{fontSize:9,color:"#3A6A8A",fontFamily:"'IBM Plex Mono'",flexShrink:0}}>{String(s.id).padStart(2,"0")}</span>
                      <span style={{color:"#A0BDD4"}}>{s.title}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── SLSA TAB ── */}
        {view==="slsa" && (
          <div className="animate-in">
            {/* Header banner */}
            <div style={{background:"#0D1A2E",border:"1px solid #1A3A6A",borderRadius:10,padding:"18px 22px",marginBottom:24}}>
              <div style={{fontSize:10,letterSpacing:3,color:"#4A9EFF",marginBottom:6}}>SUPPLY-CHAIN LEVELS FOR SOFTWARE ARTIFACTS</div>
              <div style={{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:20,fontWeight:700,color:"#E8F4FF",marginBottom:8}}>
                SLSA Framework Mapping — NFCU Current State vs Target
              </div>
              <div style={{fontSize:12,color:"#6A8AA0",lineHeight:1.7,maxWidth:740}}>
                SLSA (slsa.dev) is a security framework that defines increasing levels of supply chain integrity.
                Each level builds on the previous. The mapping below shows where NFCU currently sits, which lifecycle
                steps satisfy each requirement, and exactly what must be added to reach L1, L2, and L3.
              </div>
              {/* Current level indicator */}
              <div style={{display:"flex",gap:6,marginTop:16,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:10,color:"#6A8AA0",marginRight:4}}>CURRENT ESTIMATED LEVEL:</span>
                {["L0","L1","L2","L3"].map((lv,i) => {
                  const active = i === 0;
                  const colors = ["#E05C5C","#4A9EFF","#A78BFA","#2A9D5C"];
                  const bgs    = ["#2B0A0A","#0D1A2E","#120A20","#0A1A10"];
                  const bords  = ["#7A1E1E","#1A3A6A","#3A1A6A","#1A4A2A"];
                  return (
                    <div key={lv} style={{display:"flex",alignItems:"center",gap:0}}>
                      <div style={{padding:"5px 14px",borderRadius:5,background:active?bgs[i]:"#0A1018",border:`2px solid ${active?colors[i]:"#1A2A3A"}`,fontWeight:active?700:400,color:active?colors[i]:"#3A5A7A",fontFamily:"'IBM Plex Mono'",fontSize:12}}>
                        {lv}
                      </div>
                      {i < 3 && <div style={{width:24,height:2,background:"#1A2A3A",margin:"0 2px"}}/>}
                    </div>
                  );
                })}
                <span style={{fontSize:10,color:"#E05C5C",marginLeft:8}}>← Approaching L1. Not yet fully compliant.</span>
              </div>
            </div>

            {/* Level sections */}
            {slsaLevels.map(lv => (
              <div key={lv.level} style={{background:lv.bg,border:`1px solid ${lv.border}`,borderLeft:`4px solid ${lv.color}`,borderRadius:10,marginBottom:16,overflow:"hidden"}}>
                {/* Level header — clickable */}
                <div onClick={() => toggleSlsa(lv.level)} style={{padding:"16px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:40,height:40,borderRadius:8,background:"#080C12",border:`2px solid ${lv.color}`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:15,color:lv.color,fontFamily:"'IBM Plex Mono'",flexShrink:0}}>
                    {lv.level}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:15,fontWeight:700,color:"#E8F4FF",fontFamily:"'IBM Plex Sans',sans-serif"}}>{lv.name} — {lv.subtitle}</div>
                    <div style={{fontSize:11,color:"#6A8AA0",marginTop:3}}>{lv.description}</div>
                  </div>
                  {/* met/partial/missing pill */}
                  <div style={{padding:"4px 12px",borderRadius:4,background: lv.currentState==="met"?"#0D2F1A":lv.currentState==="partial"?"#2B1E00":"#2B0A0A",border:`1px solid ${lv.currentState==="met"?"#1E6B3A":lv.currentState==="partial"?"#7A5200":"#7A1E1E"}`,fontSize:10,color:lv.currentState==="met"?"#2A9D5C":lv.currentState==="partial"?"#F5A623":"#E05C5C",fontFamily:"'IBM Plex Mono'",flexShrink:0,whiteSpace:"nowrap"}}>
                    {lv.currentState==="met"?"✅ Achieved":lv.currentState==="partial"?"⚠️ Partial":"❌ Not Yet"}
                  </div>
                  <div style={{color:"#3A6A8A",fontSize:18,marginLeft:4}}>{slsaExpanded[lv.level]?"▲":"▼"}</div>
                </div>

                {slsaExpanded[lv.level] && (
                  <div style={{borderTop:`1px solid ${lv.border}`,padding:"18px 20px"}}>

                    {/* Current state note */}
                    <div style={{background:"#080C12",border:`1px solid ${lv.border}`,borderRadius:6,padding:"10px 14px",marginBottom:18,fontSize:11,color:"#8AAAC0",lineHeight:1.6}}>
                      <span style={{color:lv.color,fontWeight:600,letterSpacing:1,fontSize:9,fontFamily:"'IBM Plex Mono'"}}>CURRENT STATE  </span>
                      {lv.currentNote}
                    </div>

                    {/* Requirements table */}
                    <div style={{fontSize:10,letterSpacing:2,color:"#4A7A9A",marginBottom:10}}>REQUIREMENTS & CURRENT MAPPING</div>
                    <div style={{background:"#080C12",border:`1px solid ${lv.border}`,borderRadius:8,overflow:"hidden",marginBottom:20}}>
                      <div style={{background:"#0D1A2E",padding:"8px 14px",display:"grid",gridTemplateColumns:"2fr 1fr 2fr",gap:10}}>
                        <span style={{fontSize:10,fontWeight:700,color:"#4A9EFF"}}>SLSA Requirement</span>
                        <span style={{fontSize:10,fontWeight:700,color:"#4A9EFF"}}>Status</span>
                        <span style={{fontSize:10,fontWeight:700,color:"#4A9EFF"}}>Lifecycle Step(s) / Note</span>
                      </div>
                      {lv.requirements.map((req,i) => {
                        const rs = reqStatus[req.status];
                        return (
                          <div key={i} className="slsa-req" style={{padding:"10px 14px",display:"grid",gridTemplateColumns:"2fr 1fr 2fr",gap:10,alignItems:"start",background:i%2===0?"#080C12":"#0A0E16",borderTop:"1px solid #0F1E2E",transition:"background 0.15s"}}>
                            <span style={{fontSize:11,color:"#CADCFC",lineHeight:1.5}}>{req.req}</span>
                            <span style={{fontSize:9,fontWeight:700,padding:"3px 8px",borderRadius:3,background:rs.bg,border:`1px solid ${rs.b}`,color:rs.c,fontFamily:"'IBM Plex Mono'",display:"inline-block",whiteSpace:"nowrap"}}>{rs.label}</span>
                            <div>
                              <div style={{marginBottom:5,flexWrap:"wrap",display:"flex",gap:2}}>
                                {req.stepIds.map(id => <StepPill key={id} id={id}/>)}
                              </div>
                              <div style={{fontSize:10,color:"#5A7A9A",lineHeight:1.5}}>{req.note}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* What to add */}
                    <div style={{fontSize:10,letterSpacing:2,color:lv.color,marginBottom:10}}>WHAT MUST BE ADDED TO REACH {lv.level}</div>
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      {lv.addToReach.map((item,i) => {
                        const step = steps.find(s => s.id === item.stepId);
                        return (
                          <div key={i} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"10px 14px",background:"#080C12",border:`1px solid ${lv.border}`,borderLeft:`3px solid ${lv.color}`,borderRadius:6}}>
                            <span style={{fontSize:16,flexShrink:0,marginTop:1}}>{step?.icon}</span>
                            <div>
                              <div style={{fontSize:12,color:"#C0D4E8",fontFamily:"'IBM Plex Sans',sans-serif",fontWeight:600}}>{item.text}</div>
                              {step && <div style={{fontSize:10,color:"#4A6A80",marginTop:3,lineHeight:1.5}}>{step.details[0]}</div>}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                  </div>
                )}
              </div>
            ))}

            {/* Footer note */}
            <div style={{background:"#0D1A2E",border:"1px solid #1A3A6A",borderRadius:8,padding:"14px 18px",marginTop:8,fontSize:11,color:"#5A7A9A",lineHeight:1.7}}>
              <span style={{color:"#4A9EFF",fontWeight:600}}>Note: </span>
              SLSA levels are cumulative — L2 requires all L1 requirements to be met first, and L3 requires L1 + L2.
              Click each level header to expand/collapse. Step numbers reference the 19-step lifecycle in the Diagram tab.
              Full SLSA specification at <span style={{color:"#4A9EFF"}}>slsa.dev</span>.
            </div>
          </div>
        )}

      </div>
      <div style={{textAlign:"center",padding:20,fontSize:10,color:"#2A4A6A",letterSpacing:1}}>
        NFCU // CICD Tools Team — JFrog Artifactory Lifecycle // Supply Chain Hardening
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
